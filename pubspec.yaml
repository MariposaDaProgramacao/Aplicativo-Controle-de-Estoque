name: boxstock
description: "BoxStock - Controle de Estoque"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # 🎨 ÍCONES
  # ============================================================
  cupertino_icons: ^1.0.8

  # ============================================================
  # 🔥 FIREBASE
  # ============================================================
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

  # ============================================================
  # 🛠️ UTILITÁRIOS
  # ============================================================
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # ============================================================
  # 🔔 NOTIFICAÇÕES
  # ============================================================
  flutter_local_notifications: ^17.2.4

  # ============================================================
  # 📤 COMPARTILHAR (VERSÃO ATUALIZADA)
  # ============================================================
  share_plus: ^13.3.0  # 🔥 ATUALIZADO PARA A VERSÃO MAIS RECENTE

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ============================================================
  # 🖼️ ÍCONE DO APP
  # ============================================================
  flutter_launcher_icons: ^0.13.1

# ============================================================
# 🖼️ CONFIGURAÇÃO DO ÍCONE DO APP
# ============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo.png"
  adaptive_icon_background: "#FFF1D6"
  adaptive_icon_foreground: "assets/images/Logo.png"
  remove_alpha_ios: true

# ============================================================
# 📱 FLUTTER
# ============================================================
flutter:
  uses-material-design: true

  # 📦 ASSETS (IMAGENS)
  assets:
    - assets/images/Logo.png
    # - assets/images/logo_white.png  # Opcional
    # - assets/fonts/                 # Opcional

  # 🔤 FONTES PERSONALIZADAS (OPCIONAL)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700